<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<style>
    .button-container {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .button-container .btn {
        background-color: #9babbb;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }

    .title {
        font-size: 2rem;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 0.5rem 0;
    }

    .subtitle {
        color: #a0a0a0;
        font-size: 1rem;
        margin-bottom: 2rem;
        line-height: 1.5;
    }

    /* Button spacing */
    .button-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    /* Reset and Full Screen Centering */
    body.landing-page {
        background-color: #0a0a0a;
        /* Deep black */
        font-family: 'Inter', 'Arial', sans-serif;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    /* The Clean Container */
    .main-card {
        background-color: #161616;
        /* Dark grey card */
        padding: 3rem;
        border-radius: 1.5rem;
        border: 1px solid #333;
        /* Subtle border */
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        max-width: 400px;
        width: 90%;
        text-align: center;
    }

    /* Logo Styling */
    .logo-container {
        width: 120px;
        height: 150px;
        margin: 0 auto 1.5rem auto;
    }

    .logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* Typography */
    .title {
        font-size: 2rem;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 0.5rem 0;
    }

    .subtitle {
        color: #a0a0a0;
        font-size: 1rem;
        margin-bottom: 2rem;
        line-height: 1.5;
    }

    /* Button spacing */
    .button-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
</style>

<body class="landing-page">

    <div class="main-card">
        <div class="logo-container">
            <img src="{% static 'images/ai_logo.png' %}" alt="Ultimate Tic-Tac-Toe Logo" class="logo">

        </div>
        <h1 class="title">Ultimate Tic-Tac-Toe</h1>
        <p class="subtitle">Outsmart your opponent in the grid of grids.</p>
        <div class="button-container">
            <a href="" class="btn">Register</a>
            <a href="" class="btn">Login</a>
        </div>
    </div>

</body>

</html>
